; FreeDOS from its own boot floppy, as freedos.org hands it out: x86BOOT.img
; from the 144m folder of FD14-FloppyEdition.zip, copied here as boot.img.
; It starts FreeDOS's installer, which asks before it does anything: N and
; Enter leave it for an A:\> prompt.
; The floppy is not a floppy drive: the BIOS that comes with tiny386 reads
; the image through a port of the emulator's own.  DOS sees a drive A:.

[pc]
bios = bios.bin
vga_bios = vgabios.bin
mem_size = 2M
vga_mem_size = 256K
fda = boot.img
fill_cmos = 1

[display]
width = 800
height = 480

[cpu]
gen = 4
fpu = 0
