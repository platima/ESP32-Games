; For tiny386 on the PC, to install Windows 95 into win95.img: DISK-IMAGES.txt.
; boot.img is your boot floppy and win95.iso your CD, as image files.

[pc]
bios = bios.bin
vga_bios = vgabios.bin
; for setup; the board gives the same installation less
mem_size = 16M
vga_mem_size = 256K
fda = boot.img
cdb = win95.iso
hda = win95.img
fill_cmos = 1

[display]
width = 720
height = 480

[cpu]
; what tiny386's own boards use for Windows 95, and what the board's ini has
gen = 3
fpu = 0
